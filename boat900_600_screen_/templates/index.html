<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生态环境检测系统</title>
    <!-- 自定义脚本：前端库采用 CDN/本地静态文件直接引入方式（非工程化，不需要 npm run dev） -->
    <script src=[[ url_for('static', filename="./js/vue.min.js" ) ]]></script>
    <script src=[[ url_for('static', filename="./js/jquery.js" ) ]]></script>
    <script src=[[ url_for('static', filename="./js/axios.min.js" ) ]]></script>
    <script src=[[ url_for('static', filename="./js/flexible.js" ) ]]></script>
    <script src=[[ url_for('static', filename="./js/echarts.min.js" ) ]]></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/flv.js/1.6.2/flv.min.js"></script>

    <link rel="stylesheet" href=[[ url_for('static', filename="./css/index.css" ) ]] />

</head>


<body>

    <!-- 创建中央事件总线：必须放在最前面，确保后续 include 的 3 个 Vue 实例都能访问到
         （事件总线 = 一个空 Vue 实例，用 $on / $emit / $off 实现跨实例通信） -->
    <script>
        const EventBus = new Vue();
    </script>

    <!-- ============ 模块 1：9001 船（水质数据 + 视频推流 + vm Vue 实例） ============ -->
    {% include 'ship9001.html' %}

    <!-- ============ 模块 2：6001 船（水质数据 + 视频推流 + vm2 Vue 实例） ============ -->
    {% include 'ship6001.html' %}

    <!-- ============ 模块 3：逸夫楼大气监测（大气数据 + vm1 Vue 实例） ============ -->
    {% include 'atmosphere.html' %}

    <!-- ============ 统一初始化调用：必须放在所有 Vue 实例定义之后
         确保 vm1/vm2 在 created 中已通过 EventBus.$on 注册了监听，
         再调用 vm.InitHtml() 发出 EventBus.$emit('updateData')，避免首次数据丢失 ============ -->
    <script>
        vm.InitHtml();            // vm 发第一次 HTTP 请求，拉取全量数据并广播给 vm1 / vm2
        vm.levelColor();          // 9001 船：立即按数据渲染颜色
        vm.levelColor1();
        vm2.InitHtml();           // 6001 船：data_json 占位初始化（数据由 EventBus 提供）
        vm2.levelColor();
        vm1.InitHtml();           // 大气：data_json 占位初始化（数据由 EventBus 提供）

        // 每 6 秒让 vm 再拉一次数据并通过 EventBus 广播，3 个实例同步刷新
        window.setInterval(vm.GetJson, 6000, "0");
    </script>

    <!-- 公共脚本：4 个区域的时间轮播、屏幕保护切换动画等 -->
    <script src=[[ url_for('static', filename="./js/index.js" ) ]]></script>

</body>




</html>
